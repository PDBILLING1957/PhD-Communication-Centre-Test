<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b5e"><meta name="description" content="PhD Communication Centre - local-first test build">
<link rel="manifest" href="manifest.webmanifest"><title>PhD Communication Centre V1.1</title>
<style>
:root{--navy:#173b5e;--blue:#24649a;--bg:#f3f6f9;--line:#d9e1e8;--text:#1d2935;--muted:#607080;--red:#a93232;--green:#217447}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:var(--navy);color:white;padding:14px 16px;position:sticky;top:0;z-index:4}header h1{font-size:20px;margin:0}header small{opacity:.85}
nav{display:flex;gap:7px;overflow:auto;padding:10px;background:white;border-bottom:1px solid var(--line);position:sticky;top:59px;z-index:3}
button,.btn{border:0;border-radius:9px;padding:10px 13px;background:var(--blue);color:white;font-weight:600;font-size:14px;cursor:pointer}
nav button{background:#e8eef4;color:#173b5e;white-space:nowrap}nav button.active{background:var(--navy);color:white}
main{max-width:1100px;margin:auto;padding:14px}.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:15px;margin:0 0 14px;box-shadow:0 1px 2px #1020300a}
h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:12px 0 8px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
label{display:block;font-size:13px;font-weight:650;margin:9px 0 4px}input,select,textarea{width:100%;padding:11px;border:1px solid #c8d2dc;border-radius:8px;font:inherit;background:white;color:var(--text)}
textarea{min-height:88px;resize:vertical}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.row button{flex:0 0 auto}.danger{background:var(--red)}.good{background:var(--green)}.secondary{background:#e8eef4;color:var(--navy)}.card{border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}.card strong{display:block}.pill{display:inline-block;background:#e8eef4;color:#234b70;border-radius:20px;padding:3px 8px;font-size:12px;margin:2px}
.hidden{display:none!important}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.actions button{font-size:12px;padding:8px 10px}.notice{padding:10px;border-radius:8px;background:#fff6db;border:1px solid #f0df9e;font-size:13px;margin:8px 0}.success{background:#e7f5ed;border-color:#b9dfc8}.error{background:#fff0f0;border-color:#e9bcbc}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px}.check{display:flex;gap:8px;align-items:center;padding:7px;border:1px solid var(--line);border-radius:8px}.check input{width:auto}
.stat{font-size:25px;font-weight:700;color:var(--navy)}footer{padding:18px;text-align:center;color:var(--muted);font-size:12px}
@media(min-width:800px){main{padding:22px}nav{justify-content:center}}
</style></head><body>
<header><h1>PhD Communication Centre <small>V1.1 TEST</small></h1><small>Independent • Local-first • Owner-controlled test workspace</small></header>
<nav id="nav"></nav><main id="app"></main><footer>V1.1 test build • Local data on this device/browser only • Do not enter real confidential information</footer>
<script src="app.js"></script></body></html>
